name: Blog automation tests

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions:
  contents: read

concurrency:
  group: blog-automation-tests-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  tests:
    name: Automation / offline adversarial tests
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - name: Checkout proposed implementation with no write credentials
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.12'
      - name: Install hash-locked parsers
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/automation/requirements.txt
      - name: Run offline policy, object, link and API-response tests
        run: python -m unittest discover -s .github/automation/tests -v
  trusted-base-build:
    name: Trusted base / Jekyll build
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base, not implementation PR
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: ruby/setup-ruby@7b48e00e99515f8a6ecb53459862caa9fb0da7ad
        with:
          ruby-version: '3.1.7'
          bundler: '2.3.16'
          bundler-cache: false
      - name: Real full Jekyll build using unchanged base lockfile
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_DEPLOYMENT: 'true'
          BUNDLE_PATH: ${{ runner.temp }}/blog-gems
          JEKYLL_ENV: production
        run: |
          bundle install --jobs 4 --retry 2
          bundle exec jekyll build --trace --future --destination "$RUNNER_TEMP/base-built"
