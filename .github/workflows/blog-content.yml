name: Blog content checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '_posts/**'
      - 'assets/img/posts/**'

permissions:
  contents: read

concurrency:
  group: blog-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Blog content / validate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base, never PR code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5 # v4.3.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - name: Set pinned Python
        uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548 # v6.1.0
        with:
          python-version: '3.12.12'
      - name: Install trusted hash-locked parsers (no cache or source builds)
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/automation/requirements.txt
      - name: Validate Git objects and overlay only approved content
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python .github/automation/validate_content.py prepare
          --event "$GITHUB_EVENT_PATH" --base "$BASE_SHA"
          --output "$RUNNER_TEMP/content-site" --manifest "$RUNNER_TEMP/content-manifest.json"
      - name: Set pinned legacy-compatible Ruby (see activation prerequisites)
        uses: ruby/setup-ruby@7b48e00e99515f8a6ecb53459862caa9fb0da7ad
        with:
          ruby-version: '3.1.7'
          bundler: '2.3.16'
          bundler-cache: false
      - name: Install frozen trusted base gems and build full site
        working-directory: ${{ runner.temp }}/content-site
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_DEPLOYMENT: 'true'
          BUNDLE_PATH: ${{ runner.temp }}/blog-gems
          JEKYLL_ENV: production
        run: |
          bundle install --jobs 4 --retry 2
          bundle exec jekyll build --trace --future --destination "$RUNNER_TEMP/content-built"
      - name: Check rendered changed pages, local links, assets and fragments
        run: >-
          python .github/automation/validate_content.py built
          --root "$RUNNER_TEMP/content-built" --manifest "$RUNNER_TEMP/content-manifest.json"
