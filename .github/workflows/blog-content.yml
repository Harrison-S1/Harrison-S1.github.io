name: Blog content checks

on:
  pull_request:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]
    paths:
      - '_posts/**'
      - 'assets/img/posts/**'
      - 'examples/posts/**'

permissions:
  contents: read

concurrency:
  group: blog-content-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  validate:
    name: Blog content / validate
    if: github.event.pull_request.draft == false
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - name: Checkout trusted base, never PR code
        uses: actions/checkout@34e114876b0b11c390a56381ad16ebd13914f8d5
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          fetch-depth: 0
          persist-credentials: false
          submodules: false
      - uses: actions/setup-python@83679a892e2d95755f2dac6acb0bfd1e9ac5d548
        with:
          python-version: '3.12.12'
      - name: Install trusted hash-locked parsers
        run: |
          python -m pip install --require-hashes --only-binary=:all: -r .github/automation/requirements.txt
      - name: Validate exact Git objects and bounded non-exec examples
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: >-
          python .github/automation/validate_content.py prepare
          --event "$GITHUB_EVENT_PATH" --base "$BASE_SHA"
          --output "$RUNNER_TEMP/content-site" --manifest "$RUNNER_TEMP/content-manifest.json"
      - uses: ruby/setup-ruby@7b48e00e99515f8a6ecb53459862caa9fb0da7ad
        with:
          ruby-version: '3.4.12'
          bundler: '2.6.9'
          bundler-cache: false
      - name: Install frozen trusted base renderer
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: ${{ runner.temp }}/blog-gems
        run: bundle install --jobs 4 --retry 2
      - name: Exact locked Kramdown AST and syntax-only snippet checks
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: ${{ runner.temp }}/blog-gems
        run: >-
          python .github/automation/validate_content.py render
          --root "$RUNNER_TEMP/content-site" --manifest "$RUNNER_TEMP/content-manifest.json"
      - name: Build full trusted-base content overlay, never PR infrastructure
        working-directory: ${{ runner.temp }}/content-site
        env:
          BUNDLE_FROZEN: 'true'
          BUNDLE_PATH: ${{ runner.temp }}/blog-gems
          JEKYLL_ENV: production
        run: |
          # Produced by trusted prepare from the exact validated head Git object.
          SOURCE_DATE_EPOCH="$(jq -er '.head_commit_timestamp' "$RUNNER_TEMP/content-manifest.json")"
          export SOURCE_DATE_EPOCH
          bundle exec jekyll build --trace --destination "$RUNNER_TEMP/content-built"
      - name: Inspect actual rendered articles, local links, images and fragments
        run: >-
          python .github/automation/validate_content.py built
          --root "$RUNNER_TEMP/content-built" --manifest "$RUNNER_TEMP/content-manifest.json"
